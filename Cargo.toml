[package]
name = "chess-render"
version = "0.5.1"
edition = "2021"
description = "An embeddable chess GUI widget for Rust built with Macroquad. Provides a complete chess board with move validation, AI integration (UCI), clocks, undo/redo, PGN export, and customizable visuals—ready to drop into any Rust project."
license = "MIT"
authors = ["Himansh Mewada <himanshmewada06@atomicmail.io>"]
repository = "https://github.com/himanshm/chess-render"
readme = "README.md"
keywords = ["chess", "gui", "uci", "board", "macroquad"]
categories = ["game-engines", "gui"]

[dependencies]
chess = "3.2.0"
egui = "0.34.3"
egui-macroquad = "0.17.3"
log = "0.4.33"
macroquad = "0.4.15"
thiserror = "2.0.18"

# Optional UCI support
uci = { version = "0.2.3", optional = true }

[dev-dependencies]
env_logger = "0.11.10"

[features]
default = []
uci = ["dep:uci"]

[[example]]
name = "demo"
path = "examples/demo.rs"
